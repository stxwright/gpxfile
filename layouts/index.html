{{ define "main" }}
<div class="home">
    {{ if .Content }}
    <div class="home-content">
        {{ .Content }}
    </div>
    {{ end }}

    <h2 class="post-list-heading">Posts</h2>
    <ul class="post-list">
        {{ range (where .Site.RegularPages "Section" "posts") }}
        <li>
            <span class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</span>
            <h3>
                <a class="post-link" href="{{ .Permalink }}">
                    {{ .Title }}
                </a>
            </h3>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
