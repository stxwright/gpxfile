baseURL = 'https://stxwright.github.io/gpxfile/'
languageCode = 'en-gb'
title = 'GPXFile'

# Standard Hugo URL handling
canonifyURLs = false
relativeURLs = false

# Enable future content
buildFuture = true

# Enable emoji support
enableEmoji = true

[params]
 description = "A super simple site containing GPX files for cycling events. Browse the route using the interactive map, download the GPX file and upload it to your GPS device!"

[menu]
 [[menu.main]]
 name = 'Home'
 url = '/'
 weight = 1
 [[menu.main]]
 name = 'About'
 url = '/about/'
 weight = 2

[permalinks]
 posts = '/:year/:month/:day/:title/'

[frontmatter]
  date = [":filename", "date", "publishDate", "lastmod"]

[markup]
 [markup.goldmark]
 [markup.goldmark.renderer]
 unsafe = true # Allow HTML in markdown
 [markup.goldmark.parser]
 [markup.goldmark.parser.attribute]
 block = true
 title = true

[outputs]
 home = ['HTML', 'RSS']
 page = ['HTML']
 section = ['HTML', 'RSS']
